<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>首页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f5f5f5;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'HarmonyOS Sans SC', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0;
            position: relative;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            /* Mate 70 屏幕适配 */
            width: 100vw;
            height: 100vh;
            overscroll-behavior: none;
        }

        /* 华为鸿蒙/HMS浏览器安全区域适配 */
        @supports (padding: max(0px)) {
            body {
                padding-top: max(env(safe-area-inset-top), 20px);
                padding-bottom: max(env(safe-area-inset-bottom), 20px);
                padding-left: max(env(safe-area-inset-left), 20px);
                padding-right: max(env(safe-area-inset-right), 20px);
            }
        }

        /* 主容器 - 适配华为 Mate 70 */
        .main-container {
            position: relative;
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            padding: 0;
            /* 基于Mate 70屏幕比例调整 */
            aspect-ratio: 1216/2688; /* 高度/宽度，这里实际上应该是反的 */
            max-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* 背景图片容器 */
        .background-container {
            position: relative;
            width: 100%;
            height: auto;
            border-radius: 40px; /* 更大圆角适配曲面屏 */
            overflow: hidden;
            box-shadow: 0 12px 48px rgba(0,0,0,0.15); /* 加强阴影效果 */
            background-color: white;
            /* 移除固定高度，使用自适应 */
            aspect-ratio: 9/19.5; /* 近似Mate 70的屏幕比例 */
            max-height: 90vh; /* 确保不超出可视区域 */
            margin: 0 auto;
        }

        /* 背景图片 */
        .background-image {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover; /* 改为cover以完全填充容器 */
            position: absolute;
            top: 0;
            left: 0;
            background-color: #ffffff; /* 加载前的背景色 */
            border-radius: inherit;
        }

        /* 信息显示区域 */
        .info-display {
            position: absolute;
            bottom: 22%; /* 调整位置 */
            left: 0;
            width: 100%;
            padding: 20px;
            z-index: 3;
            text-align: center;
        }

        /* 时间显示 */
        .time-display {
            position: absolute;
            top: 41%; /* 精确调整位置 */
            right: auto; /* 移除右侧定位 */
            bottom: auto;
            left: 65%;
            transform: translateX(-50%);
            color: #232324;
            font-family: 'HarmonyOS Sans SC', -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif;
            font-size: 16px; /* 增大字体 */
            font-weight: 600;
            z-index: 3;
            text-align: center;
            line-height: 1.2;
            width: auto;
            white-space: nowrap;
            background: transparent;
            box-shadow: none;
            border: none;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1); /* 添加文字阴影增强可读性 */
            letter-spacing: 0.5px; /* 字间距优化 */
        }

        /* 状态标签 */
        .status-label {
            position: absolute;
            top: 30px; /* 调整位置适应状态栏 */
            right: 30px;
            background: #52c41a;
            color: white;
            padding: 10px 20px; /* 增大内边距 */
            border-radius: 25px; /* 更大圆角 */
            font-size: 15px; /* 增大字体 */
            font-weight: 600;
            z-index: 3;
            box-shadow: 0 4px 16px rgba(82,196,26,0.3);
            backdrop-filter: blur(10px); /* 毛玻璃效果 */
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* ========== 华为 Mate 70 专门优化 ========== */
        @media screen and (width: 2688px) and (height: 1216px),
               screen and (width: 1216px) and (height: 2688px),
               screen and (min-width: 1200px) and (min-height: 2600px) {

            body {
                padding-top: max(env(safe-area-inset-top), 30px);
                padding-bottom: max(env(safe-area-inset-bottom), 30px);
                padding-left: max(env(safe-area-inset-left), 30px);
                padding-right: max(env(safe-area-inset-right), 30px);
            }

            .main-container {
                max-width: 100%;
                padding: 0;
                aspect-ratio: 1216/2688;
            }

            .background-container {
                border-radius: 50px; /* 超大圆角适配曲面屏 */
                aspect-ratio: 9/19.5;
                box-shadow: 0 20px 80px rgba(0,0,0,0.2);
                max-width: 95vw; /* 留出边距 */
                max-height: 95vh;
            }

            .time-display {
                font-size: 18px; /* Mate 70上更大字体 */
                top: 41.5%;
                text-shadow: 0 2px 4px rgba(0,0,0,0.15);
                letter-spacing: 1px;
            }

            .status-label {
                top: 40px;
                right: 40px;
                padding: 12px 24px;
                font-size: 16px;
                border-radius: 28px;
            }

            /* 优化图片显示 */
            .background-image {
                object-fit: cover;
            }
        }

        /* 横屏适配 */
        @media screen and (orientation: landscape) and (min-width: 1216px) {
            .main-container {
                aspect-ratio: 2688/1216; /* 横屏比例 */
            }

            .background-container {
                aspect-ratio: 19.5/9; /* 横屏比例 */
                max-width: 90vw;
                max-height: 85vh;
            }

            .time-display {
                top: 45%;
                font-size: 20px;
            }

            .status-label {
                top: 25px;
                right: 25px;
            }
        }

        /* 竖屏适配 */
        @media screen and (orientation: portrait) and (min-height: 2600px) {
            .main-container {
                aspect-ratio: 1216/2688;
            }

            .background-container {
                aspect-ratio: 9/19.5;
                max-width: 85vw;
                max-height: 90vh;
            }

            .time-display {
                top: 41%;
                font-size: 17px;
            }
        }

        /* 中屏幕适配 (适用于折叠屏展开状态等) */
        @media screen and (min-width: 768px) and (max-width: 1199px) {
            .background-container {
                border-radius: 30px;
                aspect-ratio: 9/18;
            }

            .time-display {
                font-size: 15px;
                top: 40%;
            }

            .status-label {
                font-size: 14px;
                padding: 8px 16px;
            }
        }

        /* 小屏幕适配 */
        @media (max-width: 767px) {
            .background-container {
                border-radius: 25px;
                aspect-ratio: 9/16;
                max-height: 85vh;
            }

            .time-display {
                font-size: 14px;
                top: 40%;
            }

            .status-label {
                font-size: 13px;
                padding: 6px 14px;
                top: 20px;
                right: 20px;
            }
        }

        /* 超小屏幕适配 */
        @media (max-width: 374px) {
            .background-container {
                border-radius: 20px;
                aspect-ratio: 9/18;
            }

            .time-display {
                font-size: 13px;
                top: 39%;
            }

            .status-label {
                font-size: 12px;
                padding: 5px 12px;
                top: 15px;
                right: 15px;
            }
        }

        /* 加载优化 */
        .loading-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            z-index: 10;
            border-radius: inherit;
            display: block;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* 图片初始状态 */
        img {
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        img.loaded {
            opacity: 1;
        }

        /* 暗色模式 */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #121212;
            }

            .background-container {
                background-color: #1e1e1e;
                box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            }

            .time-display {
                color: #ffffff;
                background: transparent;
                box-shadow: none;
                text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            }

            .status-label {
                background: #389e0d;
                box-shadow: 0 4px 16px rgba(56,158,13,0.3);
                border: 1px solid rgba(56,158,13,0.2);
            }
        }

        /* 图片防拖拽和选择 */
        img {
            -webkit-user-drag: none;
            user-drag: none;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        /* 触摸反馈优化 */
        .time-display:active,
        .status-label:active {
            transform: scale(0.98);
            transition: transform 0.1s ease;
        }

        /* 华为浏览器特定优化 */
        @supports (-webkit-touch-callout: none) {
            .background-container {
                -webkit-backface-visibility: hidden;
                backface-visibility: hidden;
            }
        }

        /* 高DPI屏幕优化 */
        @media (-webkit-min-device-pixel-ratio: 2.5), (min-resolution: 240dpi) {
            .time-display {
                -webkit-font-smoothing: subpixel-antialiased;
                font-weight: 500;
            }

            .background-image {
                image-rendering: -webkit-optimize-contrast;
                image-rendering: crisp-edges;
            }
        }

        /* 折叠屏优化 */
        @supports (fold: 1) {
            .background-container {
                border-radius: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="background-container">
            <!-- 加载占位符 -->
            <div class="loading-placeholder" id="loadingPlaceholder"></div>

            <!-- 背景图片 -->
            <img
                src="./compressed_bgk.png"
                alt="访客审核通过页面"
                class="background-image"
                id="bgImage"
            >


            <!-- 信息显示区域 -->
            <div class="info-display"></div>
        </div>

        <!-- 时间显示 -->
        <div class="time-display" id="currentTime">正在加载时间...</div>
    </div>

    <script>
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('页面开始加载...');

            // 图片加载计数器
            let totalImages = 1; // 只剩背景图片
            let loadedImages = 0;

            // 显示加载动画
            const loadingEl = document.getElementById('loadingPlaceholder');

            // 获取图片元素
            const bgImage = document.getElementById('bgImage');

            // 1. 更新时间显示
            function updateBeijingTime() {
                try {
                    const now = new Date();
                    // 直接获取北京时间（UTC+8）
                    const beijingTime = new Date(now.getTime() + (8 * 60 * 60 * 1000));

                    const year = beijingTime.getUTCFullYear();
                    const month = String(beijingTime.getUTCMonth() + 1).padStart(2, '0');
                    const day = String(beijingTime.getUTCDate()).padStart(2, '0');
                    const hours = String(beijingTime.getUTCHours()).padStart(2, '0');
                    const minutes = String(beijingTime.getUTCMinutes()).padStart(2, '0');
                    const seconds = String(beijingTime.getUTCSeconds()).padStart(2, '0');

                    const timeDisplay = document.getElementById('currentTime');
                    if (timeDisplay) {
                        timeDisplay.textContent = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
                    }
                } catch (error) {
                    console.error('更新时间失败:', error);
                    // 备用时间显示
                    const timeDisplay = document.getElementById('currentTime');
                    if (timeDisplay) {
                        timeDisplay.textContent = new Date().toLocaleString('zh-CN');
                    }
                }
            }

            // 2. 图片加载完成处理
            function handleImageLoad(img) {
                img.classList.add('loaded');
                loadedImages++;
                console.log(`图片加载完成: ${img.src} (${loadedImages}/${totalImages})`);

                // 检查是否所有图片都加载完成
                if (loadedImages >= totalImages) {
                    hideLoading();
                }

                // 如果图片加载特别快，检查是否需要隐藏loading
                if (bgImage.complete) {
                    setTimeout(hideLoading, 200);
                }
            }

            // 3. 图片错误处理
            function handleImageError(img) {
                console.warn('图片加载失败:', img.src);
                img.style.opacity = '0.7';
                img.style.filter = 'grayscale(100%)';

                // 标记为已加载（即使是错误的）
                img.classList.add('loaded');
                loadedImages++;

                // 设置替代文本
                if (img.alt) {
                    img.title = '图片加载失败: ' + img.alt;
                }

                // 如果是背景图片错误，显示备用背景
                if (img.id === 'bgImage') {
                    img.style.backgroundColor = '#f0f0f0';
                    img.style.opacity = '1';
                }

                // 检查是否所有图片都处理完成
                if (loadedImages >= totalImages) {
                    hideLoading();
                }
            }

            // 4. 隐藏加载动画
            function hideLoading() {
                if (loadingEl && loadingEl.style.display !== 'none') {
                    setTimeout(() => {
                        loadingEl.style.opacity = '0';
                        loadingEl.style.transition = 'opacity 0.5s ease';
                        setTimeout(() => {
                            loadingEl.style.display = 'none';
                        }, 500);
                    }, 200);
                    console.log('隐藏加载动画');
                }
            }

            // 5. 初始化图片加载监听
            function initImageLoading() {
                if (bgImage) {
                    // 如果图片已经缓存完成
                    if (bgImage.complete) {
                        handleImageLoad(bgImage);
                    } else {
                        // 添加加载监听
                        bgImage.addEventListener('load', function() {
                            handleImageLoad(this);
                        });

                        // 添加错误监听
                        bgImage.addEventListener('error', function() {
                            handleImageError(this);
                        });
                    }
                }

                // 安全检查：如果图片已缓存完成
                if (bgImage.complete) {
                    setTimeout(hideLoading, 200);
                }

                // 超时保护：8秒后强制隐藏loading
                setTimeout(function() {
                    if (loadingEl && loadingEl.style.display !== 'none') {
                        console.warn('图片加载超时，强制隐藏loading');
                        hideLoading();
                    }
                }, 8000);
            }

        // 6. 设备检测和优化
        function optimizeForHuawei() {
            const ua = navigator.userAgent.toLowerCase();
            const isHuawei = ua.includes('huawei') || ua.includes('harmony') || ua.includes('emui');
            const isMate70 = window.innerWidth === 2688 && window.innerHeight === 1216 ||
                            window.innerWidth === 1216 && window.innerHeight === 2688;

            const width = window.innerWidth;
            const height = window.innerHeight;
            const isHighResolution = window.devicePixelRatio >= 2.5;

            console.log('设备信息:', {
                isHuawei: isHuawei,
                isMate70: isMate70,
                screenSize: `${width}×${height}`,
                devicePixelRatio: window.devicePixelRatio,
                userAgent: ua.substring(0, 80)
            });

            // 华为设备优化
            if (isHuawei) {
                document.body.classList.add('huawei-device');

                // Mate 70 特殊优化
                if (isMate70) {
                    document.body.classList.add('huawei-mate70');
                    console.log('检测到华为Mate 70，启用专属优化');
                }

                // 调整动画性能
                if (isHighResolution) {
                    document.documentElement.style.setProperty('--animation-duration', '0.3s');
                }
            }

            // 检测横竖屏
            function checkOrientation() {
                const isPortrait = window.innerHeight > window.innerWidth;
                const isMate70Portrait = isMate70 && isPortrait;
                const isMate70Landscape = isMate70 && !isPortrait;

                document.body.classList.toggle('portrait', isPortrait);
                document.body.classList.toggle('landscape', !isPortrait);
                document.body.classList.toggle('mate70-portrait', isMate70Portrait);
                document.body.classList.toggle('mate70-landscape', isMate70Landscape);

                if (isMate70) {
                    console.log(`Mate 70 ${isPortrait ? '竖屏' : '横屏'}模式: ${width}×${height}`);
                }
            }

            window.addEventListener('resize', checkOrientation);
            checkOrientation();
        }

            // 7. 初始化所有功能
            function init() {
                console.log('开始初始化...');

                // 华为设备优化
                optimizeForHuawei();

                // 初始化图片加载监听
                initImageLoading();

                // 立即显示时间
                updateBeijingTime();

                // 开始时间更新循环
                setInterval(updateBeijingTime, 1000);

                console.log('初始化完成');
            }

            // 启动初始化
            setTimeout(init, 50);

            // 全局错误处理
            window.addEventListener('error', function(e) {
                console.error('页面错误:', e.message, 'at', e.filename, 'line', e.lineno);
                return false;
            });

            // 页面完全加载后
            window.addEventListener('load', function() {
                console.log('页面完全加载完成');

                // 最终安全检查
                setTimeout(function() {
                    if (loadingEl && loadingEl.style.display !== 'none') {
                        console.log('强制完成加载');
                        hideLoading();
                    }
                }, 1500);
            });

        }, { once: true });
    </script>
</body>
</html>
